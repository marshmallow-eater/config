# Set prefix to Ctrl-b
set -g prefix C-b
unbind C-b
bind C-b send-prefix

# Quality of Life
set -g history-limit 10000
set -g allow-passthrough on
set -g mouse on
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Tabs (Windows)
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind x kill-pane

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Scrollback in nvim (replicating kitty's ctrl+b>[)
# This captures the pane content and opens it in nvim
bind [ run-shell "tmux capture-pane -pS -10000 | sed 's/\\x1b\\[[0-9;]*m//g' > /tmp/tmux-scrollback-#{user} && footclient -e nvim /tmp/tmux-scrollback-#{user} -c 'setlocal buftype=nofile' -c 'normal G'"
bind ] run-shell "tmux capture-pane -pS -10000 | sed 's/\\x1b\\[[0-9;]*m//g' > /tmp/tmux-scrollback-#{user} && footclient -e nvim /tmp/tmux-scrollback-#{user} -c 'setlocal buftype=nofile' -c 'normal G'"

# Theme (Gruvbox-ish)
set -g status-style bg='#282828',fg='#ebdbb2'
set -g pane-border-style fg='#3c3836'
set -g pane-active-border-style fg='#98971a'
