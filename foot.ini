# -*- conf -*-

[main]
shell=tmux
font=JetBrainsMono Nerd Font Mono:size=14
pad=10x10
initial-window-size-chars=120x30

[colors]
alpha=0.95
foreground=ebdbb2
background=282828

## Normal colors
regular0=3c3836  # black
regular1=cc241d  # red
regular2=98971a  # green
regular3=d79921  # yellow
regular4=458588  # blue
regular5=b16286  # magenta
regular6=689d6a  # cyan
regular7=a89984  # white

## Bright colors
bright0=928374   # bright black
bright1=fb4934   # bright red
bright2=b8bb26   # bright green
bright3=fabd2f   # bright yellow
bright4=83a598   # bright blue
bright5=d3869b   # bright magenta
bright6=8ec07c   # bright cyan
bright7=fbf1c7   # bright white

## Selection colors
selection-foreground=ebdbb2
selection-background=d65d0e

[cursor]
color=665c54 bdae93

[url]
color=458588

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
# Note: Kitty used Ctrl+c/v, but in foot these are bound to Shift to avoid breaking SIGINT.
# If you want Ctrl+c to copy ONLY when text is selected, that requires a helper script.
url-launch=Control+Shift+u
